<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    
    async function processLogo() {
      const pdf = await pdfjsLib.getDocument('/Logo_PostesNodeste.pdf').promise;
      const page = await pdf.getPage(1);
      
      const scale = 5.0;
      const viewport = page.getViewport({ scale });
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      
      await page.render({ canvasContext: ctx, viewport }).promise;
      
      // Trim transparent or white borders if white box is rendered
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
      let found = false;

      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          const idx = (y * canvas.width + x) * 4;
          const r = imgData.data[idx];
          const g = imgData.data[idx+1];
          const b = imgData.data[idx+2];
          const a = imgData.data[idx+3];
          
          // Check if pixel is NOT pure white (or has non-white content)
          if (a > 0 && (r < 240 || g < 240 || b < 240)) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
            found = true;
          }
        }
      }
      
      let outCanvas = canvas;
      if (found) {
        const pad = 20;
        minX = Math.max(0, minX - pad);
        minY = Math.max(0, minY - pad);
        maxX = Math.min(canvas.width, maxX + pad);
        maxY = Math.min(canvas.height, maxY + pad);
        
        const cropW = maxX - minX;
        const cropH = maxY - minY;
        
        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = cropW;
        cropCanvas.height = cropH;
        const cropCtx = cropCanvas.getContext('2d');
        cropCtx.drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
        
        // Remove solid white background to make logo transparent
        const cropData = cropCtx.getImageData(0, 0, cropW, cropH);
        for (let i = 0; i < cropData.data.length; i += 4) {
          const r = cropData.data[i];
          const g = cropData.data[i+1];
          const b = cropData.data[i+2];
          if (r > 245 && g > 245 && b > 245) {
            cropData.data[i+3] = 0; // Make white transparent
          }
        }
        cropCtx.putImageData(cropData, 0, 0);
        outCanvas = cropCanvas;
      }
      
      const dataUrl = outCanvas.toDataURL('image/png');
      await fetch('/save', {
        method: 'POST',
        body: dataUrl
      });
    }
    
    processLogo();
  </script>
</body>
</html>
